        timeout_seconds: 60
  - id: M83
    title: Project Plan Generator + Untrusted Planning Worker
    blocked_by: [M75, M76, M77]
    objective: >-
      Compor intake, inspection, task schema, decomposition, plan policy e
      execution assessment em um ImplementationPlan autorizado, em
      src/planner/generate.ts, E construir de fato o caminho do PLANNING
      WORKER — não deixá-lo como trabalho futuro. O planning worker é um worker
      READ-ONLY subordinado ao control plane: recebe um PlannerPacket bounded
      com user intent, ProjectInspection resumida, source anchors, constraints e
      o planning contract, e devolve um UNTRUSTED PLAN DRAFT. O PlannerPacket
      segue a filosofia do TaskPacket existente — fatos derivados e
      delimitados, nunca transcript nem documentação concatenada. O draft NÃO
      vira plano automaticamente; o pipeline determinístico é: normalização de
      schema, análise AVC/decomposição, plan policy validation, dependency
      validation, risk/readiness validation e só então ImplementationPlan
      autorizado. O worker não pode alterar plan policy, acceptance contract,
      routing policy, safety boundaries nem estado autorizado, e draft inválido
      é recusado em vez de corrigido em silêncio. A invocação do planner é feita
      por uma PORTA PROVIDER-AGNOSTIC (PlanningWorkerPort) definida aqui, com
      contrato de resultado de invocação e um planner fake/injetado para os
      testes. Como esta task vive em src/, ela NÃO conecta Claude nem Codex: o
      wiring real da porta para o launcher, permissions, credential, billing,
      quota e processo fresco pertence a M84, no plano dev/. O que M83 prova é
      que a porta é PROVIDER-READY — contrato suficiente para um adapter real,
      role read-only exigido pelo próprio contrato e resultado sempre tratado
      como untrusted —, não que o caminho real já esteja conectado. Fechar com a
      projeção determinística ImplementationPlan para PlanFile do harness,
      provando que a saída é aceita pelo parser existente, com argv sem shell e
      timeout dentro do teto do contrato. A projeção não escreve o
      dev/plan.yaml deste repositório.
    initial_files:
      - src/planner/generate.ts
      - src/planner/draft.ts
      - src/planner/validate.ts
      - src/planner/assess.ts
      - src/inspection/index.ts
      - src/routing/capability.ts
      - test/planner/generate-plan.test.ts
      - test/planner/planning-worker-draft.test.ts
    acceptance:
      - ImplementationPlan strict, versionado e determinístico em estrutura.
      - Intake, inspection, schema, decomposition, plan policy e assessment compostos sem lógica duplicada.
      - PlannerPacket bounded, com fatos derivados e source anchors, sem transcript nem documentação concatenada.
      - Planning worker é read-only e sua saída é tratada como untrusted draft.
      - Pipeline normalização, AVC, plan policy, dependencies, risk/readiness executado nessa ordem.
      - Draft inválido recusado, nunca corrigido em silêncio.
      - Worker não pode alterar plan policy, acceptance, routing policy, safety boundaries ou estado autorizado, provado por teste.
      - PlanningWorkerPort é provider-agnostic e vive em src; testes usam planner fake injetado.
      - Porta é provider-ready - contrato suficiente para adapter real, role read-only exigido pelo contrato.
      - Nenhum adapter para Claude ou Codex é implementado nesta task; wiring real pertence a M84.
      - Nenhum import de dev dentro de src, provado por typecheck e build.
      - DECOMPOSITION_REQUIRED ou plano inválido impedem a geração - fail closed.
      - Projeção ImplementationPlan para PlanFile determinística e aceita pelo parser existente.
      - argv projetado sem metacaractere de shell e timeout dentro do teto do contrato.
      - dev/plan.yaml deste repositório não é escrito pela projeção.
      - Nenhum provider real chamado nesta task.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/planner, test/dev/plan.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M84
    title: Universal Project Orchestration Lifecycle
    blocked_by: [M80, M82, M83]
    objective: >-
      Implementar em dev/ o lifecycle universal que torna o lab control plane
      de implementações reais, reusando o orquestrador existente, sem executor
      paralelo. ÚNICA task com provider wiring:
      adapter da PlanningWorkerPort de M83 para Claude/Codex (launcher,
      permissions, credential/billing/quota, processo fresco) e adapter das
      decisões de M79 para o HumanRequiredOutput real do harness. Dois
      caminhos: DIRECT (minimal factual preflight, route, budget adaptativo,
      implementer fresco, validation determinística, review só se a policy
      exigir, PASS) e REVIEWED (intake, inspect read-only, mapa de contexto,
      fatos de ambiente, planning worker read-only via porta adaptada,
      untrusted draft, normalização e validação determinística, assessment,
      gate humano proporcional, route, budget adaptativo, implementer fresco,
      validation oficial, fresh reviewer conforme policy, PASS). DIRECT nunca
      opera sobre fato ausente/inválido — preflight vem de inspection
      válida/cacheada ou coleta mínima read-only — e pula exploração ampla,
      planning worker e review redundante. Conecta a Direct Task Normalization
      de M75; confiança insuficiente vira REVIEWED_REQUIRED sem inventar a
      task. Verdict de M75 e review requirement de M76 combinam
      pelo critério mais restritivo; environment readiness é aplicado antes de
      culpar capacidade. Roles são ESTRUTURAIS: generaliza o overlay read-only
      (hoje só Codex) com mecanismo Claude via settings versionado e profiles
      de role dedicados para planner/reviewer read-only e implementer com
      mutation só no workspace autorizado. Invocação fresca por work unit com
      packets bounded; estado autoritativo em disco, independente das sessões.
      Worker runtime budget promove o timeoutSecondsOverride existente a valor
      derivado por policy, validado só contra o bound de runtime do
      launcher/profile; validation command timeout é checado separadamente
      contra o contrato ValidationCommand, sem cruzar ou usar min entre os
      bounds; fora do bound produz BUDGET_UNSUPPORTED nomeando o bound
      violado, levando a outro profile, reconfiguração, replan ou
      HUMAN_REQUIRED, nunca bypass ou degradação silenciosa. O lifecycle é
      também o writer dos ComparableRunFacts (contrato de M81), escrita
      aditiva com provenance, sem alterar runs antigos — M81 só lê depois.
      Após repair esgotado, consulta a failure diagnosis de M79: só CAPABILITY
      escala; environment, task definition, context e tooling seguem caminhos
      próprios, incluindo replan. Reviewer: contexto fresco é
      universal (nova invocação, read-only, workspace apropriado, packet
      bounded, contrato de acceptance conhecido, decisão independente, nunca
      confia no self-report, JSON único e inequívoco, read-only provado depois
      do fato); diversidade de profile/model/provider é policy-based e
      proporcional ao risco — baixo/médio pode reusar o mesmo profile com
      invocação/contexto independentes, crítico ou security-sensitive pode
      exigi-la por policy. Human gates são proporcionais: não existe aprovação humana
      universal entre plano e execução porque requested_scope registra o
      pedido do usuário — mas requested_scope NÃO é autorização geral e não
      cobre billing não autorizado, troca de billing mode, credenciais, ação
      destrutiva, efeito externo, deploy nem mudança security-sensitive não
      implicada. A autorização é de ESCOPO via ExecutionAuthorizationScope de
      M71, e NÃO por spawn: worker novo, bounded repair, effort dentro da
      ladder autorizada e troca Claude/Codex dentro da execution policy não
      exigem novo gate; cada launch ainda verifica escopo, elegibilidade,
      billing, quota, credenciais, risco e execution policy — ALLOW automático
      dentro do boundary, HUMAN_REQUIRED fora dele, obrigatório em scope
      expansion, ação destrutiva, efeito externo relevante, billing não
      autorizado, credenciais, risco crítico, decisão de arquitetura/produto
      não resolvida, decisão security-sensitive, escalation esgotada e
      evidência insuficiente. Resolver os HarnessPaths do repositório ALVO por
      override aditivo de plan file e runtime dir, mantendo o default de
      resolveHarnessPaths idêntico (sem regredir M01 a M70). Reusar
      selectNextTask, launch, close, recover, state, evidence, automatic
      repair e os guards; nada de lifecycle, attempts, evidência ou recovery
      reimplementados. O caminho de provider real existe ao fim desta task,
      desligado por default, habilitado só por ExecutionAuthorizationScope no
      nível do projeto/run (autorização de escopo, não gate por spawn), sempre
      com billing guard e credential proof antes de cada launch, com
      dry-run/preflight que não chama provider; nenhum provider real é
      executado nesta task. Fail-safe de escopo: se uma responsabilidade
      revelar que não pode ser validada coerentemente na mesma state machine,
      o resultado é DECOMPOSITION_REQUIRED ou ajuste de plano explícito, nunca
      PASS parcial nem M87 silencioso.
    initial_files:
      - dev/lib/project-orchestrate.ts
      - dev/lib/project-roles.ts
      - dev/cli/dev-project-orchestrate.ts
      - dev/lib/paths.ts
      - dev/lib/launch.ts
      - dev/lib/automatic-repair.ts
      - dev/lib/routine-autonomy-runtime.ts
      - dev/profiles/claude-reviewer-readonly.settings.json
      - src/planner/generate.ts
      - src/routing/diagnosis.ts
      - test/dev/project-orchestrate.test.ts
    acceptance:
      - Lifecycle com DIRECT e REVIEWED paths implementados e distinguíveis.
      - DIRECT executa minimal factual preflight (repo, base revision, git state, readiness mínima, validation, instruções, source anchors), aceita inspection válida/cacheada ou coleta mínima read-only, nunca opera sobre fato ausente/inválido, e pula exploração ampla, planning worker e review redundante; Direct Task Normalization de M75 conectada no path, e confiança insuficiente vira REVIEWED_REQUIRED e planning worker, sem inventar a task - tudo provado por teste.
      - Evidence recording path é o writer dos ComparableRunFacts, consumindo o contrato de M81, com escrita aditiva e provenance, sem schema paralelo em dev e sem alterar runs históricos, provado por teste.
      - Adapter real da PlanningWorkerPort de M83 para Claude/Codex e adapter das decisões de M79 para HumanRequiredOutput implementados aqui, e somente aqui.
      - Verdict de plano e review requirement combinados pelo critério mais restritivo; environment readiness aplicado antes de culpar capacidade.
      - Roles planner, implementer e reviewer com restrição estrutural, não por prompt; overlay read-only generalizado via settings Claude; planner e reviewer não mutam o repo alvo, provado por teste.
      - Invocação fresca por work unit com packets bounded, sem conversa compartilhada; estado autoritativo em disco, independente das sessões dos modelos.
      - Worker runtime budget via timeoutSecondsOverride validado só contra o bound do launcher/profile; validation command timeout checado só contra ValidationCommand; sem cruzamento nem min entre os bounds; fora do bound produz BUDGET_UNSUPPORTED nomeando o bound, levando a outro profile, replan ou HUMAN_REQUIRED, nunca degradação ou bypass silencioso, provado por teste; os três conceitos de tempo permanecem separados e nenhum teto universal de duração é aplicado.
      - Failure diagnosis consultada após repair esgotado; só CAPABILITY escala; environment, task definition, context e tooling seguem caminhos próprios, incluindo replan.
      - Reviewer sempre com nova invocação, contexto fresco, read-only provado, packet bounded e decisão JSON única; nunca decide a partir do self-report do implementer.
      - Diversidade de profile/model/provider é policy-based e proporcional ao risco - baixo/médio reusa o mesmo profile com invocação independente, provado por teste; crítico ou security-sensitive pode exigir diversidade; maintainer diferente de reviewer da routine autonomy permanece inalterado; review de modelo não substitui gates determinísticos.
      - Nenhuma aprovação humana universal entre plano e execução; requested_scope não é autorização geral - billing, credenciais, ação destrutiva, efeito externo, deploy e mudança security-sensitive continuam com gate próprio, provado por teste.
      - ExecutionAuthorizationScope de M71 é autorização de escopo, não por spawn - worker novo, bounded repair, effort dentro da ladder autorizada e troca Claude/Codex dentro da policy não exigem novo gate, provado por teste; cada launch verifica escopo, billing, quota, credenciais, risco e execution policy, com ALLOW automático dentro do boundary e HUMAN_REQUIRED fora, gate obrigatório nas condições do objective.
      - Override de plan file e runtime dir aditivo; default de resolveHarnessPaths idêntico; suíte de M01 a M70 verde, sem regressão.
      - selectNextTask, launch, close, recover, state, evidence, automatic repair e guards reusados, sem executor paralelo; workers não possuem lifecycle, DAG, estado autoritativo, routing, escalation, commit ou validation oficial, alteração de plano nem billing policy.
      - Caminho de provider real existe, desligado por default, habilitado só por ExecutionAuthorizationScope no nível do projeto/run, com billing guard e credential proof antes de cada launch; dry-run/preflight não chama provider.
      - Fail-safe de escopo - responsabilidade não validável na mesma state machine para com DECOMPOSITION_REQUIRED ou ajuste de plano explícito, sem esconder expansão, aumentar timeout arbitrariamente ou entregar PASS parcial; nenhuma criação de M87.
      - Nenhum provider real executado e nenhum projeto real conduzido nesta task.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/dev]
        timeout_seconds: 900
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M85
    title: External Project Fake E2E
    blocked_by: [M84]
    objective: >-
      Criar fixture de projeto EXTERNO sintético e provar o fluxo completo sem
      nenhum provider real, reusando os fake CLIs e o worker falso já
      existentes em fixtures/ em vez de criar novo duplo. Cobrir ao menos oito
      cenários. Um, DIRECT - task pequena e de baixo risco passa por minimal
      factual preflight e vai para route, worker, validation e PASS, sem
      inspection ampla, planning worker ou review redundantes, e sem perder
      validation determinística; provar também que a Direct Task Normalization
      produz a work unit estruturada e que fato mínimo ausente impede DIRECT em
      vez de virar default. Dois, REVIEWED - com um request ambíguo ou material
      em que a normalization NÃO alcança confiança suficiente e o fluxo cai para
      REVIEWED_REQUIRED, a task passa por inspection, planning worker draft,
      plan validation determinística, implementer, validation e fresh reviewer
      até PASS. Três,
      CAPABILITY - implementer FAIL, bounded repair FAIL, failure diagnosis
      CAPABILITY, escalation, PASS. Quatro, INFRA - INFRA_ERROR não produz
      escalation de capacidade. Cinco, ENVIRONMENT - ambiente não pronto não
      produz escalation de modelo. Seis, TASK/CONTEXT - task ampla demais ou
      pressão de contexto encaminha para replan/decomposição, sem blind
      escalation. Sete, CROSS_PROVIDER - após repair esgotado e diagnosis
      CAPABILITY, com o profile/provider atual não resolvendo e os facts de
      billing/credential/quota permitindo, o HARNESS consulta a escalation
      policy, escolhe o próximo provider/profile elegível e lança worker novo até
      PASS; provar que o worker nunca escolhe provider, que a decisão fica
      registrada pelo control plane, que a troca não herda conversa, que a
      transição aparece na evidência e que nenhuma cobrança ou provider real
      ocorre. Oito, HUMAN_GATE - simular ao menos um caso de scope expansion,
      ação destrutiva, risco crítico, decisão de arquitetura/produto não
      resolvida ou ação security-sensitive e provar que a policy leva a
      HUMAN_REQUIRED, que há ZERO spawn de worker ou provider depois do gate,
      que state e evidência são preservados e que decision needed e options
      ficam expostos ao operador — o harness precisa provar que sabe PARAR, não
      apenas executar. Sem criar cenário adicional, os oito existentes devem
      provar ainda três integrações. Primeira, WRITE para READ: um run fake
      executado pelo lifecycle grava ComparableRunFacts pelo evidence recording
      path, M81 lê essa evidência, deriva a ComparableRunIdentity e o fact novo
      aparece como valor mais provenance, NÃO como UNKNOWN; e uma fixture
      histórica sem esses facts produz UNKNOWN mais provenance em M81, sem
      migration e sem escrita. Segunda, AUTONOMIA dentro do escopo: com a
      execution policy autorizada, a sequência task 1 PASS, task 2 FAIL, repair,
      FAIL, diagnosis CAPABILITY, escalation permitida, worker novo, PASS e
      próxima task roda SEM gate humano intermediário, porque tudo permaneceu
      dentro do boundary. Terceira, PARADA na fronteira: a tentativa de
      atravessar boundary não autorizada produz HUMAN_REQUIRED e zero spawn
      posterior. Essas provas podem ser integradas aos cenários CAPABILITY,
      CROSS_PROVIDER e HUMAN_GATE já existentes. Provar também que o estado do harness é durável e que cada
      worker recebe contexto FRESCO, sem herdar conversa. O repositório alvo é
      criado e descartado pelo teste; o repositório do lab não é modificado e o
      dev/plan.yaml deste repo não é tocado pelo fluxo. Nenhuma inferência real,
      nenhum custo, nenhuma credencial de provider exercitada.
    initial_files:
      - test/e2e/project-orchestration-e2e.test.ts
      - fixtures/external-project
      - fixtures/fake-clis
      - dev/lib/project-orchestrate.ts
      - dev/profiles/fake-worker-v1.yaml
    acceptance:
      - Fixture de projeto externo sintética criada e descartada pelo teste.
      - Cenário DIRECT - minimal factual preflight, normalization bem-sucedida, route, worker, validation determinística, PASS.
      - Cenário DIRECT - fato mínimo ausente impede DIRECT em vez de virar default.
      - Cenário REVIEWED - normalization insuficiente produz REVIEWED_REQUIRED e aciona o caminho com planning worker.
      - Nenhum cenário permite que a normalization invente a task quando há ambiguidade.
      - Cenário REVIEWED - draft de planning worker, validação determinística, implementer e fresh reviewer até PASS.
      - Cenário CAPABILITY - FAIL, repair FAIL, diagnosis CAPABILITY, escalation, PASS.
      - Cenário INFRA - INFRA_ERROR sem escalation de capacidade.
      - Cenário ENVIRONMENT - ambiente não pronto sem escalation de modelo.
      - Cenário TASK/CONTEXT - replan ou decomposição sem blind escalation.
      - Cenário CROSS_PROVIDER - diagnosis CAPABILITY leva o harness a trocar de provider e alcançar PASS.
      - Cenário CROSS_PROVIDER - worker nunca escolhe provider e a decisão fica registrada pelo control plane.
      - Cenário CROSS_PROVIDER - troca de provider não herda conversa e a transição aparece na evidência.
      - Cenário HUMAN_GATE - policy leva a HUMAN_REQUIRED com decision needed e options expostos.
      - Cenário HUMAN_GATE - zero spawn de worker ou provider após o gate, provado por teste.
      - Cenário HUMAN_GATE - state e evidência preservados no ponto de parada.
      - Integração write para read - run fake grava ComparableRunFacts e M81 os lê como valor mais provenance, não UNKNOWN.
      - Fixture histórica sem os facts novos produz UNKNOWN mais provenance em M81, sem migration e sem escrita.
      - Autonomia dentro do escopo - PASS, FAIL, repair, FAIL, CAPABILITY, escalation, PASS e próxima task sem gate humano intermediário.
      - Parada na fronteira - tentativa de atravessar boundary não autorizada produz HUMAN_REQUIRED e zero spawn posterior.
      - Exatamente oito cenários; nenhuma prova nova exigiu cenário redundante.
      - Estado do harness durável entre fases, provado por teste.
      - Cada worker recebe contexto fresco, sem herdar conversa.
      - Fake CLIs e worker falso existentes reusados, sem novo duplo de provider.
      - Records de evidência produzidos e válidos ao fim de cada cenário.
      - Repositório do lab não modificado e dev/plan.yaml deste repo não tocado.
      - Nenhum provider real, nenhuma inferência e nenhuma credencial exercitada.
      - Suíte completa verde.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/e2e]
        timeout_seconds: 900
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
