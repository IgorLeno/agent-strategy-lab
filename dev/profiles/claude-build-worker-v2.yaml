# Perfil de worker Claude com política de permissões VERSIONADA.
#
# O v1 dependia de `--permission-mode acceptEdits` e do que estivesse
# configurado na máquina do usuário: acceptEdits aprova edições, não garante
# autorização de Bash. Em `--print` não há ninguém para responder a um pedido
# de permissão, então o worker travaria — ou funcionaria só por causa das
# permissões pessoais, que não entram no experimento.
#
# O que mudou em relação ao v1:
#   --output-format json custo, modelo e duração do run ficam no log, não em estimativa
#   --model              modelo FIXO: run comparável não pode depender do default da CLI
#   --settings           política de Bash/Git versionada em claude-build-worker.settings.json
#   --setting-sources    somente `project`; user e local (pessoais) ficam de fora
#
# Continua `real-world` e não `controlled`: sem `--bare`, CLAUDE.md, hooks,
# plugins e auto-memory do repositório e do usuário ainda carregam. O modo
# controlado exige `--bare` + ANTHROPIC_API_KEY e é outro perfil.
id: claude-build-worker-v2
agent: claude
argv:
  - claude
  - --print
  - --output-format
  - json
  - --model
  - claude-opus-5
  - --settings
  - dev/profiles/claude-build-worker.settings.json
  - --setting-sources
  - project
  - --permission-mode
  - acceptEdits
  - --strict-mcp-config
  - --no-session-persistence
prompt_delivery: argv
timeout_seconds: 1800
forbidden_flags:
  - --resume
  - -r
  - --continue
  - -c
  - --fork-session
  - --session-id
  - --dangerously-skip-permissions
  - --allow-dangerously-skip-permissions
env_allowlist:
  - PATH
  - HOME
  - LANG
  - LC_ALL
  - TERM
  - USER
  - SHELL
  - ANTHROPIC_API_KEY
env_extra:
  CI: '1'
control_markers:
  instruction_discovery: --bare
  plugins_and_hooks: --bare
  auto_memory: --bare
  mcp_servers: --strict-mcp-config
  session_persistence: --no-session-persistence
  non_interactive: --print
  permission_policy: --settings
  personal_settings_excluded: --setting-sources
  model_pinned: --model
notes:
  - 'Execução paga: só rodar com autorização explícita do usuário.'
  - 'Verificado contra Claude Code 2.1.223: --model, --settings, --setting-sources, --permission-mode, --strict-mcp-config e --no-session-persistence existem nessa versão.'
  - 'Sem --bare: CLAUDE.md, hooks e plugins do projeto CARREGAM; user e local ficam fora por --setting-sources project.'
  - 'A allow list precisa cobrir os comandos de validação do plano — dev-doctor confere.'
  - 'Nunca comparar resultados deste perfil com os de um perfil controlled.'
