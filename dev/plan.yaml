        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60

  # -------------------------------------------------------------------------
  # Marco 3 — Adaptive universal project orchestration (M71–M86)
  #
  # O Agent Strategy Lab é o CONTROL PLANE; Claude Code e Codex são WORKERS que
  # recebem work packets delimitados. Workers não possuem lifecycle global,
  # DAG, estado autoritativo, routing, escalation, commit oficial, validation
  # oficial, alteração de plano, autorização humana nem billing/quota policy.
  # O estado autoritativo vive em disco, fora da memória conversacional dos
  # modelos.
  #
  # Unidade de trabalho: ATOMIC VALIDATABLE CHANGE (AVC) — objetivo único,
  # contexto delimitado, blast radius delimitado, fronteiras de
  # responsabilidade claras, verificável isoladamente, PASS/FAIL objetivo.
  # NÃO existe teto universal de duração: uma task coerente e independentemente
  # verificável pode ter budget maior, e uma task curta que atravessa
  # responsibilidades demais ainda precisa ser decomposta. Duração é UM sinal,
  # nunca a regra.
  #
  # Três conceitos de tempo são INDEPENDENTES, têm números potencialmente
  # diferentes e cada um responde a UM bound próprio: estimated task duration é
  # sinal de planejamento e não tem teto arquitetural; worker runtime budget é o
  # limite do processo do worker e é validado contra launcher e profile;
  # validation command timeout é o limite INDIVIDUAL de cada comando e é
  # validado contra o contrato ValidationCommand. É proibido derivar o runtime
  # do worker de min(bound do worker, bound de validação): os limites não se
  # cruzam, e um budget de worker maior que o teto de um comando de validação
  # não é inconsistência. O execution budget é adaptativo (task + profile +
  # custo de validação + evidência histórica); recomendação fora do bound
  # apropriado produz resultado explícito nomeando o bound violado, nunca
  # bypass silencioso.
  #
  # Contratos e lógica pura ficam em src/ (buildável); wiring de lifecycle fica
  # em dev/, que já pode importar src/. src/ NÃO pode importar dev/:
  # tsconfig.build.json compila somente src/ com rootDir src.
  #
  # Reuso obrigatório em vez de abstração nova: derivações de profile de
  # dev/lib/doctor.ts, roles/reviewer/overlay read-only de
  # dev/lib/routine-autonomy*.ts, timeoutSecondsOverride de dev/lib/launch.ts,
  # TaskPacket de dev/lib/schemas.ts, TaskBudgets/TaskTaxonomy de
  # src/schemas/task-spec.ts, readTrialHistory/derivePerformance de
  # src/performance/, guards de billing/quota e o lifecycle do dev-orchestrate.
  #
  # Nada aqui remove ou altera o benchmark pilot-v1: ExperimentSpec congelado,
  # fingerprint, runExperimentSchedule genérico, profiles e evidência histórica
  # permanecem intactos e disponíveis como ferramenta de calibração.
  # -------------------------------------------------------------------------
  - id: M71
    title: Project Intake + Execution Authorization Contract
    blocked_by: [M70]
    objective: >-
      Criar em src/intake/ o contrato formal de entrada de um pedido de
      implementação sobre um repositório EXTERNO. O ProjectIntakeRequest deve
      representar no mínimo: repo alvo, base revision, user request, objetivos,
      constraints, exclusões e o requested_scope / execution_intent — o registro
      de que o usuário pediu explicitamente a implementação daquele escopo, para
      que gates humanos posteriores sejam proporcionais em vez de redundantes.
      requested_scope NÃO é autorização geral: ele não autoriza, por si só,
      cobrança não autorizada, troca de billing mode, uso de credenciais, ação
      destrutiva, efeito colateral externo, produção ou deployment, expansão de
      escopo, alteração security-sensitive não implicada pelo pedido, nem
      execução de provider real que exija gate próprio. O contrato deve tornar
      essa separação explícita para impedir a inferência futura "o usuário pediu
      X, logo qualquer ação necessária está autorizada". Para que essa separação
      não vire burocracia por spawn, esta task define também a
      ExecutionAuthorizationScope provider-neutral, com três partes distintas:
      requested_scope (o que o usuário pediu), autonomous execution boundary
      (as ações que o harness pode realizar sem novo gate humano — por exemplo
      workspaces descartáveis locais, workers de assinatura já configurados,
      validation determinística, bounded repair, capability escalation dentro da
      ladder aprovada e cross-provider entre profiles de assinatura previamente
      permitidos) e human-gated capabilities (o que continua exigindo
      intervenção — billing de API não previamente autorizado, mudança de
      billing mode, ação destrutiva, deployment/produção, efeito colateral
      externo relevante, scope expansion, nova fronteira de credenciais, decisão
      de arquitetura ou produto não resolvida, ação crítica ou
      security-sensitive, profile/provider fora da execution policy, evidência
      insuficiente e escalation segura esgotada). A autorização é de ESCOPO, no
      nível do projeto/run: um spawn individual dentro do boundary não é um novo
      gate. Reusar contratos existentes onde eles já servirem, em vez de criar
      estrutura paralela. Contrato
      strict e versionado, com identidade canônica determinística reusando
      canonicalSha256 de src/envelope; não criar hasher novo. O intake é estado
      do control plane, persistido e auditável, nunca memória conversacional de
      worker. Somente contrato nesta task: nenhuma inspeção, planning, routing
      ou execução, e nenhum provider. risk, envelope adaptativo e context
      requirements pertencem ao contrato de planning task (M73), não aqui.
    initial_files:
      - src/intake/index.ts
      - src/schemas/index.ts
      - src/envelope/index.ts
      - test/intake/intake-request.test.ts
    acceptance:
      - ProjectIntakeRequest strict e versionado.
      - Repo alvo e base revision representados; base revision exige SHA de 40 hex.
      - user_request, objectives, constraints e exclusions presentes.
      - requested_scope / execution_intent registrado explicitamente, para gates proporcionais posteriores.
      - Contrato separa requested_scope de autorização; billing, credenciais, ação destrutiva, efeito externo, deploy, scope expansion, mudança security-sensitive e provider real continuam com gates próprios.
      - Teste prova que requested_scope sozinho não autoriza nenhuma dessas categorias.
      - ExecutionAuthorizationScope strict e versionada, provider-neutral, definida em src.
      - As três partes - requested_scope, autonomous execution boundary e human-gated capabilities - são distinguíveis no contrato.
      - Autorização é de escopo no nível do projeto/run; o contrato não exige gate por spawn individual.
      - Ação dentro do boundary é representável como permitida sem novo gate; ação fora do boundary é representável como HUMAN_REQUIRED.
      - Nenhuma estrutura paralela criada onde um contrato existente já serve.
      - Identidade canônica determinística via canonicalSha256 existente; nenhum hasher novo.
      - Reordenar chaves não muda a identidade.
      - Intake é estado persistido do control plane, não memória de worker.
      - Nenhuma inspeção, planning, routing ou execução nesta task.
      - TaskSpec e TaskTaxonomy inalterados.
      - Nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/intake]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M72
    title: Repository Inspector + Context/Environment Facts
    blocked_by: [M71]
    objective: >-
      Implementar inspeção READ-ONLY do repositório alvo em src/inspection/,
      produzindo um ProjectInspection com os fatos que o control plane precisa
