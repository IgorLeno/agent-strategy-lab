      launch que injeta obrigatoriamente a Claude quota probe como observeQuota,
      observa quota antes de todo launch e retry, e conecta authorizeSlot →
      quota probe → derivação → BillingGuard → executeSlot. Impedir spawn
      quando quota >= 80%. Manter autorização humana explícita e separada.
      Fornecer dry-run/preflight que não chama provider nem autoriza inferência.
      O caminho real deve exigir confirmação explícita e evidência humana.
      Preservar integralmente o fingerprint do ExperimentSpec: 2 arms Medium vs
      High, 3 tasks, 2 repetitions por arm/task, 12 slots, seed/order existentes
      e threshold 80%. Nenhum provider real deve ser executado durante M70.
      Não lançar os 12 slots reais. A branch backup/prepilot-quota contém uma
      implementação histórica apenas como referência: as tarefas formais devem
      ser executadas normalmente pelo harness; não tratar aqueles commits como
      já aceitos nem cherry-pická-los.
    initial_files:
      - src/experiment/runner.ts
      - src/experiment/pilot.ts
      - src/experiment/index.ts
      - src/adapters/claude/quota.ts
      - src/cli/index.ts
    acceptance:
      - Observer Claude obrigatória no caminho oficial (observeQuota injetada).
      - Abaixo de 80 permite o executor.
      - Igual a 80 e acima de 80 bloqueiam antes do executor.
      - Segunda execução recebe nova probe.
      - Retry recebe nova probe.
      - Ausência de autorização humana bloqueia.
      - Dry-run/preflight com authorizes_real_inference=false; não chama provider nem autoriza inferência.
      - Caminho real exige confirmação explícita e evidência humana.
      - Scheduler genérico continua permitindo observeQuota ausente.
      - Fingerprint do ExperimentSpec permanece inalterado (2 arms Medium vs High, 3 tasks, 2 reps, 12 slots, seed/order existentes, threshold 80%).
      - Nenhum provider real nos testes.
      - backup/prepilot-quota é referência histórica; commits dali não são aceitos; a tarefa corre pelo harness.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/experiment, test/cli, test/billing, test/e2e/experiment-fake-e2e.test.ts]
        timeout_seconds: 300
