  - id: M74
    title: AVC Task Decomposition Engine
    blocked_by: [M73]
    objective: >-
      Implementar lógica PURA de decomposição em src/planner/decomposition.ts,
      sem I/O e sem provider, baseada em ATOMIC VALIDATABLE CHANGE. Uma task
      deve ser dividida quando deixou de ser uma mudança coerente e validável —
      não porque o relógio passou de N minutos. Sinais avaliados: objetivo
      único, contexto delimitado, blast radius delimitado, fronteiras de
      responsabilidade, complexity, ambiguity, risk, verification,
      dependências, superfície esperada de changed-files, custo de validação,
      pressão esperada de contexto/tokens, isolamento de retry, fronteira de
      rollback/recovery e possibilidade de determinar PASS/FAIL objetivamente.
      É PROIBIDO implementar qualquer regra da forma "duração acima de N
      obrigatoriamente decompõe": duração é um sinal entre outros. Uma task
      coerente, bem delimitada e verificável isoladamente PODE ter budget de
      execução maior. Uma task curta pode exigir decomposição por atravessar
      responsabilidades demais, misturar outcomes, ter ambiguidade alta, não ser
      validável isoladamente ou exigir contexto excessivo. Também não
      substituir budget adequado por fragmentação artificial. O veredito nomeia
      os sinais que o dispararam, com provenance. Over-fragmentation e
      MERGE_RECOMMENDED são do validador de plano (M75).
    initial_files:
      - src/planner/decomposition.ts
      - src/planner/task.ts
      - test/planner/decomposition.test.ts
    acceptance:
      - Função pura, sem I/O, sem spawn, sem provider.
      - Veredito determinístico - mesma entrada produz mesma saída.
      - Nenhuma regra de duração absoluta obrigando decomposição, provado por teste.
      - Task longa mas coerente e verificável isoladamente NÃO é decomposta só por duração.
      - Task curta com responsabilidades demais ou blast radius amplo É decomposta.
      - Ambiguidade alta, impossibilidade de validação isolada e contexto excessivo disparam decomposição.
      - Isolamento de retry e fronteira de rollback considerados.
      - DECOMPOSITION_REQUIRED nomeia os sinais disparados, com provenance.
      - Fragmentação artificial não é recomendada em lugar de budget adequado.
      - Sinal ausente não é tratado como sinal favorável.
      - Nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/planner]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M75
    title: Plan Policy Validator
    blocked_by: [M74]
    objective: >-
      Implementar em src/planner/validate.ts a validação determinística do
      PLANO COMPLETO mais a policy de workflow proporcional, reusando a engine
      de M74 para o veredito por task. Detectar: objetivos múltiplos, ciclos de
      dependência, dependências inválidas ou inexistentes, acceptance ausente,
      validation insuficiente, tasks que deveriam ser divididas e
      over-fragmentation. Emitir os quatro vereditos DECOMPOSITION_REQUIRED,
      MERGE_RECOMMENDED, DIRECT_ALLOWED e REVIEWED_REQUIRED. DIRECT_ALLOWED só
      é permitido com critérios OBJETIVOS: trabalho estreito, risco baixo,
      ambiguidade baixa, escopo conhecido, contexto delimitado, sem escolha
      arquitetural aberta, sem comportamento security-sensitive, sem efeito
      colateral externo relevante, sem mudança ampla de comportamento, com
      validation conhecida e source of truth suficiente. Qualquer critério não
      satisfeito ou desconhecido resulta em REVIEWED_REQUIRED — fail safe.
      DIRECT_ALLOWED NUNCA significa ausência de validation determinística NEM
      ausência de fatos: ele exige um MINIMAL FACTUAL PREFLIGHT — repo e base
      revision confirmados, git/working state relevante conhecido, fatos mínimos
      de environment readiness obtidos ou revalidados, validation disponível
      identificada, instruções e source anchors necessários descobertos, e
      nenhum fato consumido pelo router ausente ou inválido. Esses fatos podem
      vir de um ProjectInspection válido/cacheado OU de coleta mínima read-only.
      DIRECT pula exploração ampla, planning worker, plan draft completo e review
      redundante — não pula os fatos. O verdict precisa declarar quais fatos
      mínimos são exigidos e se a fonte cacheada é aceitável. Esta task também
      implementa a DIRECT TASK NORMALIZATION: a etapa determinística do control
      plane que transforma ProjectIntakeRequest mais requested_scope mais fatos
      do minimal factual preflight mais validation e contexto conhecidos em um
      DirectTaskCandidate e, daí, numa work unit compatível com PlannedTask, que
      é então avaliada por M74 e pelo restante desta policy. Ela preenche
      SOMENTE fatos derivados diretamente do request, dos fatos do repo, de
      source anchors conhecidos, de validation observada e de policy
      determinística; é PROIBIDO inventar arquitetura, acceptance sem base,
      dependências complexas, tratar risco desconhecido como baixo, criar source
      anchors inexistentes, presumir validation não observada ou aceitar
      fronteiras de task ambíguas. Ela NÃO é um segundo planner e não faz
      raciocínio semântico de planejamento. Se não for possível construir a work
      unit com confiança suficiente, o resultado obrigatório é
      REVIEWED_REQUIRED, que encaminha para inspection completa, planning
      worker, untrusted draft e validação determinística.
      Detecção de ciclo é implementada em src/ porque findDependencyCycle do
      harness não é exportado e src não pode importar dev; a semântica deve
      casar com a do harness. Plano inválido é FAIL CLOSED: não executável nem
      projetável. Não corrigir o plano automaticamente, não classificar
      execução (M76) e não rotear (M78).
    initial_files:
      - src/planner/validate.ts
      - src/planner/decomposition.ts
      - src/planner/task.ts
      - test/planner/validate-plan.test.ts
    acceptance:
      - Validação pura e determinística do plano inteiro.
      - Ciclo de dependência recusa o plano com o caminho do ciclo no motivo.
      - Dependência inexistente e autodependência recusadas.
      - acceptance ausente ou validation insuficiente recusadas.
      - DECOMPOSITION_REQUIRED derivado da engine de M74, sem lógica duplicada.
      - MERGE_RECOMMENDED nomeia as tasks candidatas a combinação.
      - DIRECT_ALLOWED exige todos os critérios objetivos satisfeitos.
      - Critério não satisfeito ou desconhecido produz REVIEWED_REQUIRED - fail safe.
      - DIRECT_ALLOWED nunca dispensa validation determinística, provado por teste.
      - DIRECT_ALLOWED declara o minimal factual preflight exigido e aceita fatos de inspection cacheada válida ou de coleta mínima read-only.
      - Fato mínimo ausente ou inválido impede DIRECT_ALLOWED, provado por teste.
      - Direct Task Normalization determinística produz work unit compatível com PlannedTask a partir de intake, requested_scope e fatos do preflight.
      - Normalization preenche somente fatos derivados de request, repo, source anchors conhecidos, validation observada e policy determinística.
      - Normalization não inventa arquitetura, acceptance sem base, dependências, risco, anchors, validation nem fronteiras ambíguas, provado por teste.
      - Normalization não executa raciocínio semântico de planejamento e não é um segundo planner.
      - Confiança insuficiente na normalization produz REVIEWED_REQUIRED e encaminha para o caminho completo com planning worker.
      - M74 e o restante da policy sempre recebem work unit estruturada, nunca request bruto.
      - Plano inválido não é executável nem projetável - fail closed.
      - Nenhuma correção automática do plano.
      - Nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/planner]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M76
    title: Execution Assessment
    blocked_by: [M72, M73]
    objective: >-
      Implementar em src/planner/assess.ts a avaliação DETERMINÍSTICA e
      rule-based de execução de uma task, derivando de PlannedTask mais fatos
      do ProjectInspection: difficulty, risk, context pressure, ENVIRONMENT
      READINESS, verification strength, review requirement e confidence, todos
      com rationale e provenance. Environment readiness compara os environment
      requirements da task com os fatos observados: repositório acessível, base
      revision válida, git state conhecido, estado de dependências, comando de
      build conhecido, testes conhecidos, validation disponível, ferramentas e
      serviços locais requeridos, instruções descobríveis, constraints de
      ambiente e permissões de filesystem adequadas. UNKNOWN NÃO é READY, e
      fato ausente nunca vira default otimista — reduz confiança, jamais
      aumenta. Ambiente inadequado é classificado como problema de ambiente e
      nunca justifica elevar reasoning effort ou modelo. Os fatos de readiness
      podem vir de um ProjectInspection completo OU do minimal factual preflight
      do caminho DIRECT; a origem entra na provenance, e fato mínimo ausente ou
      inválido reduz confiança e impede tratar readiness como conhecida. Review
      requirement é derivado de risco, verification strength e evidência
      disponível, e precisa expressar DUAS dimensões separadas: a exigência de
      review independente (fresh context, sempre que aplicável) e a exigência de
      DIVERSIDADE de profile/model/provider, que é PROPORCIONAL ao risco — em
      risco baixo/médio o mesmo profile pode revisar desde que invocação e
      contexto sejam independentes; em risco alto a diversidade é preferida; em
      risco crítico ou security-sensitive a policy pode exigi-la. Diversidade
      não é condição universal de independência. O resultado combina depois com
      o verdict de plano de M75 pelo critério MAIS
      RESTRITIVO. Nenhuma leitura de histórico nesta task (é M82), nenhum
      modelo, nenhum provider, nenhuma escolha de profile e nenhum budget de
      runtime (é M78).
    initial_files:
      - src/planner/assess.ts
      - src/planner/task.ts
      - src/inspection/index.ts
      - test/planner/assess.test.ts
    acceptance:
      - Avaliação pura, determinística e rule-based.
      - difficulty, risk, context pressure, verification strength, review requirement e confidence derivados com rationale e provenance.
      - EnvironmentReadiness derivada comparando requirements da task com fatos observados.
      - Todos os fatos de readiness listados no objective representados.
      - UNKNOWN não é READY, provado por teste.
      - Fato ausente reduz confiança e nunca vira default otimista.
      - Ambiente inadequado classificado como problema de ambiente, sem elevar effort ou modelo.
      - Origem dos fatos de readiness registrada na provenance - inspection completa ou minimal factual preflight.
      - Review requirement derivado de risco, verification strength e evidência.
      - Review requirement separa exigência de review independente da exigência de diversidade de profile/model/provider.
      - Diversidade é proporcional ao risco e não é condição universal de independência, provado por teste.
      - Nenhuma leitura de histórico de performance nesta task.
      - Nenhuma escolha de profile e nenhum budget de runtime nesta task.
      - PlannedTask de entrada não é mutado.
      - Nenhum provider real.
    validation:
