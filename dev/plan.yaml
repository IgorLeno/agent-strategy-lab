  - id: M78
    title: Initial Profile Router + Initial Execution Budget
    blocked_by: [M76, M77]
    objective: >-
      Implementar em src/routing/router.ts o router DETERMINÍSTICO inicial e o
      budget de execução inicial: execution assessment mais fatos do projeto
      mais capability registry produzem profile inicial E envelope de runtime,
      com rationale e provenance. Considerar task_class, difficulty,
      complexity, ambiguity, risk, stack, verification strength, context
      pressure, environment readiness, review requirement e compatibilidade de
      role. Objetivo é UTILIDADE, não só qualidade: escolher o MENOR recurso com
      probabilidade suficientemente alta de resolver corretamente aquela classe
      de trabalho. O starting profile NÃO precisa ser o menor degrau — pode
      começar em degrau intermediário quando a classificação justificar. O
      budget inicial é o WORKER RUNTIME BUDGET, grandeza distinta da estimated
      task duration do envelope e do validation command timeout; derivado de
      envelope da task, capability do profile escolhido, custo esperado de
      validação, stack e ambiente. Ele é validado contra o SEU bound e somente
      contra ele: launcher e profile runtime. O teto por comando de validação
      pertence ao contrato ValidationCommand e é validado separadamente; é
      PROIBIDO derivar o runtime do worker de min(bound do worker, bound de
      validação), e um worker runtime budget maior que o teto de um comando de
      validação não é inconsistência. Se a recomendação ficar fora do bound de
      runtime, o resultado é EXPLÍCITO — BUDGET_UNSUPPORTED com o bound violado
      identificado (por exemplo WORKER_RUNTIME_BOUND) e, quando os contratos
      permitirem de forma simples, budget solicitado, bound suportado, origem do
      bound, profile e provenance. Isso pode
      levar a outro profile adequado, reconfiguração, replan ou HUMAN_REQUIRED —
      nunca a bypass silencioso dos limites estruturais. O router sempre recebe
      uma work unit já estruturada, vinda do planner completo ou da Direct Task
      Normalization, nunca um request bruto. É PROIBIDO
      introduzir teto universal de duração, e é proibido tratar budget como
      substituto de decomposição. Herdar a política existente: profile de
      cobrança por API nunca é escolhido implicitamente. Profile indisponível ou
      incompatível com o role é descartado com motivo, sem substituição
      silenciosa. Nenhuma leitura de histórico nesta task (é M82). Nenhuma
      execução, nenhum spawn, nenhum provider.
    initial_files:
      - src/routing/router.ts
      - src/routing/capability.ts
      - src/planner/assess.ts
      - test/routing/router.test.ts
    acceptance:
      - Decisão pura e determinística - mesma entrada produz mesmo profile e mesmo budget.
      - RoutingDecision carrega profile, budget inicial, rationale, provenance, candidatos considerados e rejeições com motivo.
      - Sinais de context pressure, environment readiness, verification strength e review requirement influenciam a decisão.
      - Task fácil e local escolhe o degrau mais econômico adequado.
      - Task difícil ou de risco alto pode iniciar em degrau intermediário, com rationale.
      - Budget inicial derivado de envelope, capability, custo de validação, stack e ambiente.
      - Worker runtime budget, estimated task duration e validation command timeout permanecem separados.
      - Worker runtime budget validado somente contra launcher e profile runtime.
      - Validation command timeout validado somente contra o contrato ValidationCommand.
      - Nenhum min entre bound de worker e bound de validação, provado por teste.
      - Worker runtime budget maior que o teto de um comando de validação não é tratado como inconsistência.
      - Budget fora do bound de runtime produz BUDGET_UNSUPPORTED identificando o bound violado.
      - BUDGET_UNSUPPORTED pode levar a outro profile, reconfiguração, replan ou HUMAN_REQUIRED.
      - Nenhum bypass silencioso dos limites estruturais existentes, provado por teste.
      - Router sempre recebe work unit estruturada, do planner completo ou da Direct Task Normalization.
      - Nenhum teto universal de duração introduzido, provado por teste.
      - Budget maior nunca é usado como substituto de decomposição.
      - Fatos do minimal factual preflight bastam para o router decidir no caminho DIRECT; fato ausente ou inválido impede a decisão em vez de virar default.
      - Profile de billing API nunca escolhido implicitamente.
      - Profile indisponível ou incompatível com o role descartado com motivo.
      - Nenhuma consulta a histórico de performance nesta task.
      - Nenhum spawn e nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/routing]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M79
    title: Failure Diagnosis + Escalation Policy
    blocked_by: [M78]
    objective: >-
      Criar em src/routing/diagnosis.ts o conceito formal de FAILURE DIAGNOSIS
      e, a partir dele, a escalation policy. O fluxo é: first pass, falha
      capability-bearing, BOUNDED REPAIR no mesmo profile, falha novamente,
      FAILURE DIAGNOSIS, e só então a decisão apropriada. O diagnóstico
      classifica ao menos INFRA, ENVIRONMENT_NOT_READY, TASK_DEFINITION_TOO_BROAD,
      CONTEXT_PRESSURE, VALIDATION_OR_TOOLING_GAP, CAPABILITY e
      UNKNOWN_INSUFFICIENT_EVIDENCE, com razão e provenance. Somente CAPABILITY
      autoriza a escalation ladder. ENVIRONMENT_NOT_READY vai para remediação de
      ambiente; TASK_DEFINITION_TOO_BROAD e CONTEXT_PRESSURE vão para
      replan/decomposição ou re-escopo de contexto; VALIDATION_OR_TOOLING_GAP é
      problema do harness/tooling e pode exigir humano; UNKNOWN é FAIL CLOSED
      para HUMAN_REQUIRED ou diagnóstico adicional, nunca assumido como
      capability para manter momentum. Reusar a SEMÂNTICA já existente na
      routine autonomy — classificação, rationale, boundary, retry budget
      bounded, decision needed, why automation stopped, options e referências de
      evidência — em vez de criar vocabulário paralelo. Mas src/ NÃO pode
      importar dev/: esta task define contratos PROVIDER-NEUTRAIS em
      src/routing/ (FailureDiagnosis, EscalationDecision e uma decisão de
      intervenção humana equivalente), e o adapter dessas decisões puras para o
      HumanRequiredOutput real do harness pertence a M84, no plano dev/. Não
      duplicar conceitos além do necessário e não criar dependência src para
      dev. A ladder é CONFIGURÁVEL, resolvida contra o
      capability registry e a policy; a ordem default precisa ser justificada
      por capacidade crescente, sem hard-code de família de modelo. Preservar
      integralmente o bounded repair existente: repair é UM, no MESMO profile, e
      NÃO é escalation. Escalation exige autorização PRÓPRIA — uma por degrau,
      com decisão, evidência e provenance registradas — mas autorização própria
      NÃO significa necessariamente nova autorização HUMANA: quando o degrau
      pretendido já está dentro da ladder aprovada pela ExecutionAuthorizationScope
      do projeto, a autorização é DERIVADA da policy, com provenance
      project_execution_policy, e o harness prossegue automaticamente. Degrau
      fora da ladder autorizada, profile ou provider fora da execution policy e
      billing de API não previamente autorizado produzem HUMAN_REQUIRED. Nada
      disso reutiliza cegamente a autorização de
      repair. INFRA_ERROR permanece capability-neutral: não consome degrau, não
      cria autorização, não eleva effort nem modelo. Ladder esgotada resulta em
      HUMAN_REQUIRED explícito, nunca em loop. Decisão PURA nesta task: sem I/O,
      sem spawn, sem provider. Degraus cross-provider ficam em M80.
    initial_files:
      - src/routing/diagnosis.ts
      - src/routing/escalation.ts
      - src/routing/capability.ts
      - src/performance/attempt-facts.ts
      - dev/lib/routine-autonomy.ts
      - test/routing/diagnosis.test.ts
      - test/routing/escalation.test.ts
    acceptance:
      - FailureDiagnosis é contrato formal com razão e provenance.
      - As sete classes de diagnóstico do objective existem e são distinguíveis.
      - Somente CAPABILITY autoriza escalation, provado por teste.
      - ENVIRONMENT_NOT_READY não eleva effort nem modelo.
      - TASK_DEFINITION_TOO_BROAD e CONTEXT_PRESSURE encaminham para replan ou re-escopo, não para escalation.
      - VALIDATION_OR_TOOLING_GAP encaminha para harness/tooling e pode exigir humano.
      - UNKNOWN é fail closed para HUMAN_REQUIRED ou diagnóstico adicional, nunca assumido como capability.
      - Semântica de classificação e de intervenção humana reusada da routine autonomy, sem vocabulário paralelo.
      - Contratos são provider-neutrais e vivem em src/routing; nenhum import de dev dentro de src, provado por typecheck e build.
      - Adapter para o HumanRequiredOutput real do harness fica fora desta task, em M84.
      - Diagnosis ocorre entre repair esgotado e escalation.
      - EscalationLadder configurável, resolvida contra o capability registry, com ordem default justificada.
      - Nenhum hard-code de família de modelo ou de ordem provider a provider.
      - Repair permanece bounded a um e no mesmo profile.
      - Escalation exige autorização própria, uma por degrau, com decisão, evidência e provenance.
      - Autorização de escalation pode ser derivada da ExecutionAuthorizationScope, com provenance project_execution_policy, sem novo gate humano.
      - Degrau dentro da ladder autorizada prossegue automaticamente, provado por teste.
      - Degrau fora da ladder, profile ou provider fora da execution policy e billing de API não autorizado produzem HUMAN_REQUIRED.
      - Escalation nunca reusa cegamente a autorização de repair.
      - INFRA_ERROR não consome degrau nem eleva effort ou modelo.
      - Sequência de INFRA_ERROR não produz escalation de capacidade.
      - Ladder esgotada produz HUMAN_REQUIRED explícito, sem loop.
      - AttemptRole existente reusado, sem enum paralelo.
      - Nenhum degrau cross-provider nesta task.
      - Nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/routing]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M80
    title: Cross-provider Escalation
    blocked_by: [M79]
    objective: >-
      Estender a ladder de M79 para permitir degraus em OUTRO provider —
      Claude e Codex/OpenAI — conforme os profiles configurados, sem hard-code
      de direção nem de família. O degrau cross-provider só pode ser proposto a
      partir de uma decisão diagnosticada como CAPABILITY; qualquer outro
      diagnóstico nunca troca de provider. Provider availability, credencial
      ausente, quota insuficiente e billing bloqueado NÃO são capability
      failures: descartam o degrau com motivo, preservam a neutralidade de
      capacidade e jamais contam como FAIL do agente. Os guards existentes de
      billing e quota são consultados ANTES de propor degrau de outro provider e
      permanecem provider-neutral e inalterados. Profile de cobrança por API
      continua nunca sendo escolhido implicitamente. A troca de provider é
      decisão do Agent Strategy Lab, nunca do worker, e quando o par de profiles
      já está dentro da ladder e da ExecutionAuthorizationScope aprovadas ela
      ocorre AUTOMATICAMENTE, com autorização derivada da policy e provenance
      registrada — sem novo gate humano só por ser outro provider. Provider ou
      profile fora da execution policy autorizada produz HUMAN_REQUIRED. Se todos os degraus
      restantes estiverem indisponíveis, o resultado é HUMAN_REQUIRED com o
      motivo de cada degrau descartado. Decisão pura: nenhum spawn, nenhum
      provider real.
    initial_files:
      - src/routing/escalation.ts
      - src/routing/diagnosis.ts
      - src/routing/capability.ts
      - src/billing/guard.ts
      - test/routing/escalation-cross-provider.test.ts
    acceptance:
      - Ladder aceita degraus de provider diferente, definidos por configuração.
      - Degrau cross-provider só é proposto a partir de diagnóstico CAPABILITY.
      - Provider failure separado de capability failure, provado por teste.
      - Credencial ausente, quota insuficiente ou billing BLOCK descartam o degrau com motivo.
      - Degrau descartado por indisponibilidade não conta como capability FAIL.
      - Guards de billing e quota consultados antes de propor degrau de outro provider.
      - BillingGuard provider-neutral inalterado.
      - Profile de billing API nunca escolhido implicitamente.
      - Troca de provider é decisão do harness, nunca do worker.
      - Cross-provider entre profiles dentro da ladder e da execution policy autorizadas ocorre automaticamente, com autorização derivada e provenance.
      - Provider ou profile fora da execution policy autorizada produz HUMAN_REQUIRED, provado por teste.
      - Todos os degraus indisponíveis produz HUMAN_REQUIRED com motivo por degrau.
      - INFRA_ERROR continua capability-neutral no caminho cross-provider.
      - Nenhum spawn e nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/routing, test/billing]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M81
    title: Performance History Query
    blocked_by: [M77]
    objective: >-
      Criar camada READ-ONLY em src/performance/query.ts que consulta os
      performance records históricos por características de task e identidade de
      profile, reusando readTrialHistory e derivePerformance em vez de
      recalcular métricas. Suportar as agregações que o routing adaptativo
      precisa: attempts, first-pass, final-pass, repair rate, escalation rate,
      distribuição de duração, tokens, consumo de quota, custo equivalente de
      API quando disponível, intervenção humana, qualification e sinais de
      context pressure. A IDENTIDADE DE SÉRIE precisa impedir que resultados
      incomparáveis sejam fundidos. Criar uma ComparableRunIdentity derivada,
      construída SOMENTE a partir de evidência autoritativa que já existe: fato
      disponível vira valor mais provenance; fato indisponível vira UNKNOWN mais
      provenance. NÃO fingir que dimensões como transporte, role ou
      contexto/readiness já são campos do RunPerformanceRecord, e não inventar
      valores. A identidade de profile usa profile_id mais um fingerprint
      canônico determinístico derivado do profile autoritativo — não inventar um
      campo de versão textual que o LauncherProfile não possui — de modo que, se
      o mesmo YAML mudar no futuro, runs antigos e novos não se misturem em
      silêncio só porque o id continuou igual. Quando uma dimensão NECESSÁRIA
      para comparabilidade estiver UNKNOWN, as séries não são fundidas
      automaticamente. Duas execuções não são a mesma série apenas por
      compartilharem o nome do modelo. Esta task é ESTRITAMENTE READ-ONLY: ela
      não escreve performance records, execution records, metadata novo,
      migrations, backfills nem evidência adicional, e não tem side effect.
      Read-only, porém, NÃO impede DEFINIR schema: esta task é a dona do
      contrato puro e provider-neutral dos ComparableRunFacts e da
      ComparableRunIdentity — campos, versão e requisitos de provenance — em
      src/, sem I/O. Esse contrato é COMPARTILHADO: o writer do evidence
      recording path do lifecycle (M84, em dev/, que pode importar src) o
      consome para persistir os facts dos runs NOVOS, e esta camada o consome
      para ler. É proibido criar schema paralelo em dev/. Enquanto os facts não
      existirem num run, a dimensão correspondente permanece UNKNOWN com
      provenance. Evidência histórica é IMUTÁVEL: nenhuma
      escrita, nenhuma migração, nenhum recompute destrutivo; provenance
      preservada e resultado recomputável. Tamanho de amostra sempre explícito;
      métrica ausente permanece null com motivo, nunca zero; amostra
      insuficiente é reportada como insuficiente em vez de virar taxa. Esta task
      apenas consulta: nenhuma decisão de routing nem de budget (é M82).
    initial_files:
      - src/performance/query.ts
      - src/performance/history.ts
      - src/performance/derive-performance.ts
      - src/routing/capability.ts
      - test/performance/query.test.ts
    acceptance:
      - Camada estritamente read-only, sem nenhuma escrita em data/.
      - readTrialHistory e derivePerformance reusados, sem recálculo paralelo de métricas.
      - Agregações de attempts, first-pass, final-pass, repair, escalation, duração, tokens, quota, custo, intervenção humana, qualification e context pressure disponíveis.
      - ComparableRunIdentity construída somente de evidência autoritativa existente.
      - Fato disponível vira valor com provenance; fato indisponível vira UNKNOWN com provenance.
      - Nenhuma dimensão inexistente é fingida como campo já presente e nenhum valor é inventado.
      - Identidade de profile usa profile_id mais fingerprint canônico determinístico; nenhum campo de versão inventado.
      - Mudança do mesmo profile YAML separa as séries em vez de misturá-las pelo id igual.
      - Dimensão necessária em UNKNOWN impede fusão automática de séries, provado por teste.
      - Séries incomparáveis não são fundidas; nome de modelo igual não basta, provado por teste.
      - Nenhuma acceptance desta task exige escrita de qualquer tipo.
      - Nenhum performance record, execution record, metadata, migration, backfill ou evidência é escrito aqui, e nenhum side effect ocorre.
      - ComparableRunFacts e ComparableRunIdentity definidos como contrato puro, versionado e provider-neutral em src, sem I/O.
      - Contrato inclui campos, versão e requisitos de provenance, e é consumível tanto pelo reader quanto pelo writer.
      - Nenhum schema paralelo de comparable facts existe em dev.
      - Registro dos facts comparáveis de runs novos pertence ao evidence recording path de M84.
      - Fact comparável ainda não registrado permanece UNKNOWN com provenance, sem bloquear a consulta.
      - Tamanho de amostra explícito em toda agregação.
      - Amostra insuficiente reportada como insuficiente, não convertida em taxa.
      - Métrica ausente permanece null com motivo, nunca zero.
      - Distribuição de duração disponível para recomendação futura de budget.
      - Provenance preservada e resultado recomputável.
      - Nenhum record histórico alterado, provado por teste.
      - Nenhuma decisão de routing nem de budget nesta task.
      - Nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/performance]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900
      - argv: [git, diff, --check]
        timeout_seconds: 60
  - id: M82
    title: History-informed Router + Budget Recommendation
    blocked_by: [M78, M81]
    objective: >-
      Usar a consulta de M81 para melhorar o router de M78 sem substituí-lo, em
      src/routing/history-router.ts. Quando houver evidência suficiente na
      MESMA série comparável, características da task mais performance histórica
      produzem o profile inicial recomendado E uma recomendação de execution
      budget derivada da distribuição de duração observada; quando não houver, o
      resultado é fallback DETERMINÍSTICO para M78. O limiar mínimo de amostra é
      configurável e explícito: amostra minúscula não decide, ausência de
      evidência nunca vira certeza, e nenhuma precisão é inventada — sem
      intervalo de confiança fabricado nem fórmula pseudoestatística sem dados.
      A recomendação otimiza UTILIDADE: probabilidade de first-pass, sucesso
      final, taxa de repair e de escalation, duração, tokens, quota, custo,
      intervenção humana, qualification, context pressure e compatibilidade de
      ambiente. Empate ou evidência ambígua cai no fallback determinístico. A
      decisão registra rationale e provenance dizendo se veio de histórico ou de
      fallback, quais agregações a sustentam, qual a série usada e qual o
      tamanho da amostra. Nenhuma escrita em evidência histórica, nenhum spawn,
      nenhum provider real.
    initial_files:
      - src/routing/history-router.ts
      - src/routing/router.ts
      - src/performance/query.ts
      - test/routing/history-router.test.ts
    acceptance:
      - Evidência suficiente na mesma série produz profile inicial informado por histórico.
      - Evidência suficiente produz recomendação de execution budget derivada da duração observada.
      - Evidência insuficiente cai em fallback determinístico para o router de M78.
      - Limiar mínimo de amostra configurável e explícito na decisão.
      - Amostra minúscula não decide.
      - Ausência de evidência nunca vira certeza e nenhuma precisão é inventada.
      - Empate ou evidência ambígua resolve por fallback determinístico.
      - Otimização considera first-pass, sucesso final, repair, escalation, duração, tokens, quota, custo, intervenção humana, qualification e context pressure.
      - rationale e provenance indicam origem, agregações, série e tamanho de amostra.
      - Router de M78 continua funcionando isolado e com comportamento inalterado.
      - Recomendação de budget nunca substitui decomposição necessária.
      - Recomendação de worker runtime budget validada apenas contra o bound de runtime de M78; fora dele produz BUDGET_UNSUPPORTED nomeando o bound, sem cruzar com o teto de validation command.
      - Nenhuma escrita em evidência histórica.
      - Nenhum spawn e nenhum provider real.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/routing, test/performance]
