appId: dev.asl.desktop
productName: Agent Strategy Lab
directories:
  output: dist
# O bundle do electron-vite já contém tudo; node_modules não entra no pacote.
# Sem a exclusão explícita, o electron-builder sobe até a raiz do workspace e
# empacota as dependências de produção do control plane antigo.
files:
  - out/**
  - package.json
  - '!node_modules/**'
linux:
  target: AppImage
  category: Development
  artifactName: agent-strategy-lab-${version}.${ext}
  # O nome do pacote (@asl/desktop) não serve como nome de arquivo.
  executableName: agent-strategy-lab
