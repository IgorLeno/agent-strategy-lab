# Definição VERSIONADA e autoritativa das microtarefas do agent-strategy-lab.
# Fonte de verdade operacional — `.dev/` é apenas runtime, `docs/BACKLOG.md` é
# apenas visão humana derivada. Fase S (S01A–S06) não aparece aqui: é o
# bootstrap manual do próprio harness, executado antes de ele existir.
schema_version: 1

tasks:
  # -------------------------------------------------------------------------
  # Marco 0 — Contratos (antes de storage/runner)
  # -------------------------------------------------------------------------
  - id: M01
    title: Scaffold do produto
    blocked_by: []
    objective: >-
      Criar o layout src/<área> do produto (core, schemas, envelope, storage,
      workspace, runner, adapters, strategies, evaluator, scorer, reporting,
      project, cli), garantir os scripts build/test/typecheck e escrever
      docs/ARCHITECTURE.md, docs/BACKLOG.md, docs/LESSONS.md e
      docs/adr/ADR-0001-stack.md com o texto corrigido do SQLite
      (better-sqlite3 escolhido por maturidade e API síncrona, não por flag;
      node:sqlite dispensa flag desde 22.13.0 mas segue experimental na linha
      22; risco de addon nativo registrado).
    initial_files:
      - package.json
      - tsconfig.json
      - src/core/version.ts
    acceptance:
      - Diretórios de src/ criados com um index.ts ou módulo inicial cada.
      - docs/ARCHITECTURE.md descreve o modelo de dados e o layout de evidência.
      - docs/adr/ADR-0001-stack.md registra a escolha do better-sqlite3 e o risco de addon nativo.
      - docs/BACKLOG.md espelha dev/plan.yaml para leitura humana.
      - pnpm typecheck, pnpm build e pnpm test verdes.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, build]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M02
    title: Enums separados das 3 dimensões
    blocked_by: [M01]
    objective: >-
      Definir em src/core os enums de execução (COMPLETED/TIMED_OUT/CRASHED/
      CANCELLED/INFRA_ERROR), avaliação (PASS/FAIL/PARTIAL/NOT_EVALUATED) e
      qualificação (QUALIFIED/UNSCORABLE/MISSCOPED/CONTAMINATED/
      INVALID_ENVIRONMENT/HISTORICAL_ONLY), mais os tipos core e a hierarquia
      de erros. Nenhum enum único combinando dimensões.
    initial_files:
      - src/core/version.ts
    acceptance:
      - As três dimensões são tipos independentes; nenhum valor aparece em dois enums.
      - Erros do lab têm classe base própria com código estável.
      - Testes de parse cobrem valores válidos e inválidos de cada dimensão.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/core/enums.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M03
    title: TaskSpec mínimo (público, com budgets)
    blocked_by: [M02]
    objective: >-
      Schema zod do TaskSpec público: id, descrição, critérios visíveis,
      classe, dificuldade, stack, graders públicos e budgets
      (expected/maximum de duração, tokens e arquivos alterados). É o material
      que PODE ir ao workspace do agente.
    initial_files:
      - src/core/index.ts
    acceptance:
      - TaskSpec valida entrada correta e rejeita budgets incoerentes (expected > maximum).
      - Nenhum campo de grader oculto ou rubrica no TaskSpec.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/task-spec.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M03B
    title: EvaluationPlan mínimo (privado)
    blocked_by: [M03]
    objective: >-
      Schema zod do EvaluationPlan privado: graders ocultos, rubrica, pesos.
      Vive só no lab; entra apenas no evaluation envelope e NUNCA no envelope
      de execução nem no workspace do agente.
    initial_files:
      - src/schemas/task-spec.ts
    acceptance:
      - EvaluationPlan é um tipo separado de TaskSpec, sem herança nem reuso que vaze campos ocultos.
      - Teste garante que serializar um TaskSpec nunca inclui campos de EvaluationPlan.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/evaluation-plan.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M04
    title: AgentProfile e EnvironmentProfile
    blocked_by: [M03B]
    objective: >-
      Schemas do AgentProfile (CLI, versão, modelo, flags) e do
      EnvironmentProfile (modo controlled|real-world, allowlist de env,
      fingerprint dos instruction files, plugins/skills/MCPs registrados).
      Resultados de modos diferentes nunca se misturam.
    initial_files:
      - src/schemas/evaluation-plan.ts
    acceptance:
      - EnvironmentProfile exige allowlist explícita e HOME sanitizado no modo controlled.
      - Modo real-world registra o que NÃO foi controlado, em vez de omitir.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/profiles.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M05
    title: StrategyDef e receita direct@1
    blocked_by: [M04]
    objective: >-
      Schema StrategyDef para receitas declarativas versionadas em
      strategies/<nome>/<versão>/strategy.yaml, mais a receita direct@1
      (prompt único, sem etapas intermediárias).
    initial_files:
      - src/schemas/profiles.ts
    acceptance:
      - StrategyDef carrega strategies/direct/1/strategy.yaml e valida.
      - Nome e versão da estratégia são materiais para o envelope de execução.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/strategy.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M06
    title: Trial e ExecutionRequest
    blocked_by: [M05]
    objective: >-
      Trial = tentativa planejada (Agent + Model + Strategy +
      EnvironmentProfile + status do trial: PLANNED/EXECUTED/CANCELLED/
      REPEATED). ExecutionRequest = tudo que o runner precisa para materializar
      um run a partir de um Trial.
    initial_files:
      - src/schemas/strategy.ts
    acceptance:
      - Trial separa falha de infra (trial repetido) de falha do agente (run FAIL).
      - ExecutionRequest referencia trial, base SHA, budgets e timeout.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/trial.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M07
    title: ExecutionRecord
    blocked_by: [M06]
    objective: >-
      Schema do ExecutionRecord: status de execução (enum da dimensão de
      execução), exit code, duração, execution_envelope_sha256, métricas com
      provenance POR CAMPO (campo ausente = null + origem registrada).
    initial_files:
      - src/schemas/trial.ts
    acceptance:
      - Métrica ausente é null com origem registrada, nunca zero silencioso.
      - Status de execução aceita apenas valores da dimensão de execução.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/execution-record.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M08
    title: EvaluationRecord
    blocked_by: [M07]
    objective: >-
      Schema do EvaluationRecord: evaluation_id, outcome da dimensão de
      avaliação, resultado por grader, versões dos graders e
      evaluation_envelope_sha256.
    initial_files:
      - src/schemas/execution-record.ts
    acceptance:
      - Um run pode ter N EvaluationRecords; cada um com id e envelope próprios.
      - Grader obrigatório falho força outcome FAIL.
      - Testes de parse válido/inválido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/evaluation-record.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M09
    title: ScoreRecord e QualificationRecord
    blocked_by: [M08]
    objective: >-
      Schemas do ScoreRecord (score_profile_id + versão, sub-scores, budgets
      usados, coverage) e do QualificationRecord (status da dimensão de
      qualificação + justificativa). Regra de métrica ausente - obrigatória
      resulta em UNSCORABLE; opcional resulta em sub-score null e coverage
      reduzida, SEM redistribuir peso.
    initial_files:
      - src/schemas/evaluation-record.ts
    acceptance:
      - Peso de sub-score ausente nunca é redistribuído; coverage cai.
      - QualificationRecord exige justificativa quando o status não é QUALIFIED.
      - Testes de parse válido/inválido cobrindo as duas regras.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/score-record.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M10
    title: Envelope hashes (execução e avaliação separados)
    blocked_by: [M09]
    objective: >-
      src/envelope/ com execution_envelope_sha256 (TaskSpec + Strategy + prompt
      compilado + base SHA + AgentProfile + EnvironmentProfile + modelo + flags
      CLI + adapter/versão + budgets + timeout) e evaluation_envelope_sha256
      (digest do execution manifest + EvaluationPlan + versões dos graders +
      ambiente do evaluator + comandos de avaliação), via serialização canônica.
    initial_files:
      - src/schemas/score-record.ts
    acceptance:
      - Mesma configuração produz o mesmo execution_envelope_sha256.
      - Mudar uma flag CLI muda o envelope de execução.
      - Mudar hidden grader muda SÓ o evaluation_envelope_sha256.
      - Ordem de chaves na entrada não afeta o hash.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/envelope/envelope.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  # -------------------------------------------------------------------------
  # Evidência
  # -------------------------------------------------------------------------
  - id: M11
    title: Run directory create e metadata inicial
    blocked_by: [M10]
    objective: >-
      src/storage/: criar data/runs/<run-id>/ com execution/, metadata inicial
      e run-id ULID. Data dir default <lab>/data/, sobrescrevível por
      AGENTLAB_DATA_DIR ou config.
    initial_files:
      - src/envelope/index.ts
    acceptance:
      - Run dir criado com estrutura esperada e run-id ULID ordenável.
      - AGENTLAB_DATA_DIR sobrescreve o default.
      - Criar duas vezes o mesmo run-id falha em vez de sobrescrever.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/run-dir.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M12
    title: JSONL append seguro
    blocked_by: [M11]
    objective: >-
      Append de eventos em JSONL sem corromper linhas: uma linha por evento,
      escrita completa, newline garantida, sem interleaving parcial.
    initial_files:
      - src/storage/run-dir.ts
    acceptance:
      - Appends concorrentes produzem linhas íntegras e parseáveis.
      - Objeto com newline embutida não quebra o formato.
      - Arquivo termina sempre com newline.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/jsonl.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M13
    title: Primitives de manifest e ledger
    blocked_by: [M12]
    objective: >-
      Manifest de hashes por seção (sha256 por artifact + digest agregado) e
      append no ledger.jsonl da raiz do run. Cada seção (execution,
      evaluations/<id>, scores/<id>) tem manifest próprio e independente.
    initial_files:
      - src/storage/jsonl.ts
    acceptance:
      - Manifest lista cada artifact com caminho relativo, tamanho e sha256.
      - Digest agregado é determinístico e independente da ordem de leitura do diretório.
      - Ledger registra cada adição sem reescrever entradas anteriores.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/manifest.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M14
    title: Finalização da execução (selar execution/)
    blocked_by: [M13]
    objective: >-
      Selar execution/ exatamente uma vez com manifest próprio e entrada no
      ledger; evaluations/ e scores/ passam a ser adições posteriores. Nenhum
      manifest raiz sobrescrito.
    initial_files:
      - src/storage/manifest.ts
    acceptance:
      - Selar duas vezes a mesma execução falha explicitamente.
      - Após selar, adicionar evaluation cria entrada nova no ledger sem tocar em execution/manifest.json.
      - Ledger é logicamente append-only.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/finalize.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M15
    title: Integrity verification
    blocked_by: [M14]
    objective: >-
      Verificação de integridade que detecta alteração de conteúdo (inclusive
      valor válido em schema), remoção de artifact, reordenação de linhas de
      JSONL e adulteração do ledger.
    initial_files:
      - src/storage/finalize.ts
    acceptance:
      - Alterar um valor válido em schema é detectado pelo manifest.
      - Remover um artifact listado é detectado.
      - Reordenar linhas de events.jsonl é detectado.
      - Editar uma entrada antiga do ledger é detectado.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/integrity.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M16
    title: Redaction de strings
    blocked_by: [M15]
    objective: >-
      Redaction de secrets em strings antes de qualquer persistência - tokens
      de provider, chaves de API, bearer tokens, padrões de env sensível.
      Aplicada a stdout, stderr e stream do provider.
    initial_files:
      - src/storage/integrity.ts
    acceptance:
      - Tokens falsos de formato conhecido são substituídos por placeholder estável.
      - Redaction preserva o restante da linha (a linha sanitizada continua útil).
      - Nenhum secret sobrevive em round-trip de escrita e leitura.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/redaction.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M17
    title: Redaction estruturada e de environment
    blocked_by: [M16]
    objective: >-
      Redaction recursiva em objetos e em mapas de variáveis de ambiente,
      preservando forma e chaves, redigindo apenas valores sensíveis.
    initial_files:
      - src/storage/redaction.ts
    acceptance:
      - Objetos aninhados são redigidos sem perder estrutura.
      - Env vars fora da allowlist do EnvironmentProfile são redigidas ou omitidas de forma registrada.
      - Chaves sensíveis por nome são redigidas mesmo com valor de formato desconhecido.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/storage/redaction-structured.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  # -------------------------------------------------------------------------
  # Execução
  # -------------------------------------------------------------------------
  - id: M18
    title: Disposable clone create a partir de base SHA
    blocked_by: [M17]
    objective: >-
      src/workspace/: clone descartável INDEPENDENTE do repo-alvo no base SHA.
      Não usar linked worktree - worktree compartilha objects, refs e config
      com o repo do usuário e o agente pode alcançá-los.
    initial_files:
      - src/storage/redaction-structured.ts
    acceptance:
      - O clone tem objects próprios; nenhum alternates apontando para o repo-alvo.
      - O clone está exatamente no base SHA pedido.
      - Nenhum remote com credencial é herdado.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/workspace/clone.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M19
    title: Clone cleanup garantido e proteção do repo-alvo
    blocked_by: [M18]
    objective: >-
      Descarte do clone efêmero ao fim do run, inclusive em caminho de erro, e
      guarda que impede qualquer escrita no repo-alvo original.
    initial_files:
      - src/workspace/clone.ts
    acceptance:
      - Clone é removido mesmo quando o run falha.
      - Tentativa de operar no repo-alvo original é rejeitada por guarda explícita.
      - Cleanup não confirmado é reportado como erro, não silenciado.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/workspace/cleanup.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M20
    title: Git state e change bundle capture
    blocked_by: [M19]
    objective: >-
      Capturar o resultado do agente como change bundle - changes.patch,
      changes-manifest.json (arquivos, hashes) e material_tree_sha256.
    initial_files:
      - src/workspace/cleanup.ts
    acceptance:
      - changes.patch reaplica sobre o base SHA e reproduz a árvore do agente.
      - material_tree_sha256 é estável para a mesma árvore.
      - Arquivos novos, removidos e renomeados aparecem no manifest.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/workspace/change-bundle.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M21
    title: Basic process runner
    blocked_by: [M20]
    objective: 'src/runner/: spawn de processo com argv (sem shell), coleta de exit code e sinal.'
    initial_files:
      - src/workspace/change-bundle.ts
    acceptance:
      - Exit code de sucesso e de falha são reportados corretamente.
      - Comando inexistente vira erro de infra, não exit code inventado.
      - Nenhuma interpolação de shell em nenhum caminho.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/runner/spawn.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M22
    title: Captura incremental de stdout e stderr
    blocked_by: [M21]
    objective: >-
      Captura incremental para stdout.log e stderr.log, com redaction aplicada
      antes de persistir, sem bufferizar o processo inteiro em memória.
    initial_files:
      - src/runner/spawn.ts
    acceptance:
      - Saída volumosa é persistida incrementalmente, sem estourar memória.
      - Linha parcial no fim do stream é tratada sem perder bytes.
      - Redaction acontece antes da escrita em disco.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/runner/capture.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M23
    title: Timeout com SIGTERM e escalada SIGKILL
    blocked_by: [M22]
    objective: >-
      Timeout externo - SIGTERM, período de graça, SIGKILL. Processo que ignora
      SIGTERM ainda assim é encerrado.
    initial_files:
      - src/runner/capture.ts
    acceptance:
      - Processo que ignora SIGTERM é morto por SIGKILL após a graça.
      - Execução que estoura o limite é marcada TIMED_OUT (dimensão de execução).
      - Evidência parcial é preservada.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/runner/timeout.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M24A
    title: Process-group - spawn em grupo próprio e sinais no grupo
    blocked_by: [M23]
    objective: >-
      Spawn em process group próprio (setsid) e envio de sinais ao GRUPO -
      SIGTERM, graça, SIGKILL. execa sozinho não mata a árvore.
    initial_files:
      - src/runner/timeout.ts
    acceptance:
      - Descendente do processo alvo recebe o sinal.
      - Sinal nunca escapa para fora do grupo criado.
      - PGID é registrado na evidência do run.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/runner/process-group.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M24B
    title: Verificação de sobreviventes pós-kill
    blocked_by: [M24A]
    objective: >-
      Após o kill do grupo, verificar sobreviventes. Cleanup não confirmado
      resulta em INFRA_ERROR, nunca em COMPLETED silencioso.
    initial_files:
      - src/runner/process-group.ts
    acceptance:
      - Descendente que sobrevive ao pai é detectado.
      - Cleanup não confirmável marca o run como INFRA_ERROR.
      - A verificação não depende de sleep fixo arbitrário para dar veredito.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/runner/survivors.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M25
    title: Fake adapter success
    blocked_by: [M24B]
    objective: >-
      fixtures/fake-agent/ falando a INTERFACE INTERNA do lab (não formato de
      provider) e src/adapters/fake/ consumindo-a - variante success.
    initial_files:
      - src/runner/survivors.ts
    acceptance:
      - Um run fake completo produz ExecutionRecord COMPLETED.
      - O fake agent não depende de nenhum formato de provider real.
      - Eventos normalizados são emitidos pela interface interna.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/adapters/fake-success.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M26
    title: Fake adapter failure, timeout, malformed-stream, child-process-leak
    blocked_by: [M25]
    objective: >-
      Variantes restantes do fake agent, cada uma normalizada para o estado
      correto da dimensão de execução. malformed-stream não pode ser fatal -
      linha bruta sanitizada preservada, evento desconhecido armazenado.
    initial_files:
      - src/adapters/fake/index.ts
    acceptance:
      - failure produz COMPLETED com resultado de falha, não CRASHED.
      - timeout produz TIMED_OUT.
      - malformed-stream não derruba o run; a linha sanitizada é preservada.
      - child-process-leak deixa descendente detectável pela verificação do M24B.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/adapters/fake-variants.test.ts]
        timeout_seconds: 600
