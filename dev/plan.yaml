  - id: M27A
    title: Evaluator workspace separado
    blocked_by: [M26]
    objective: >-
      Workspace do evaluator - novo clone do mesmo base SHA, apply do
      changes.patch e injeção do EvaluationPlan SÓ ali. Registra os componentes
      do evaluation envelope; descarta o workspace ao fim.
    initial_files:
      - src/adapters/fake/variants.ts
    acceptance:
      - EvaluationPlan nunca aparece no workspace do agente.
      - Patch aplica sobre o base SHA e reproduz a árvore avaliada.
      - Workspace do evaluator é descartado inclusive em erro.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/evaluator/workspace.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M27B
    title: Command grader
    blocked_by: [M27A]
    objective: >-
      Grader que executa um comando (argv, sem shell) no workspace do evaluator
      e converte exit code e saída em resultado de grader, com timeout próprio.
    initial_files:
      - src/evaluator/workspace.ts
    acceptance:
      - Exit code 0 vira grader PASS; não-zero vira FAIL.
      - Timeout do grader é distinto de falha do grader.
      - Saída do grader é persistida em grader-artifacts com redaction.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/evaluator/command-grader.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M28
    title: Evaluator com um grader
    blocked_by: [M27B]
    objective: >-
      Orquestração da avaliação - roda os graders do EvaluationPlan, calcula o
      outcome (grader obrigatório falho resulta em FAIL) e produz
      EvaluationRecord com evaluation_envelope_sha256 e manifest próprio.
    initial_files:
      - src/evaluator/command-grader.ts
    acceptance:
      - Grader obrigatório falho força outcome FAIL.
      - Grader opcional falho permite PARTIAL, registrado.
      - Reavaliar cria evaluations/<novo-id>/ sem tocar na anterior.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/evaluator/evaluate.test.ts]
        timeout_seconds: 600
      - argv: [pnpm, test]
        timeout_seconds: 600

  - id: M29
    title: Score profile v1
    blocked_by: [M28]
    objective: >-
      Perfil de score versionado v1 - sub-scores de tempo, tokens e escopo
      relativos aos budgets do TaskSpec, teto por outcome. Score é de um run
      individual; estatística agregada NÃO entra aqui (fica no compare, fase C).
    initial_files:
      - src/evaluator/evaluate.ts
    acceptance:
      - Sub-scores usam budgets expected/maximum, não constantes mágicas.
      - Outcome FAIL impõe teto de score.
      - Métrica obrigatória ausente resulta em UNSCORABLE; opcional ausente resulta em sub-score null sem redistribuir peso.
      - Nenhuma variância ou intervalo de confiança é calculado aqui.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/scorer/score-profile.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 600

