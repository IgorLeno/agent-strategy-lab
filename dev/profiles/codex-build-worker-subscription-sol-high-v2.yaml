# Perfil Codex Sol High (identidade explícita) para worker sem ownership de
# commit ou validação oficial. Operacionalmente equivalente ao legacy
# `codex-build-worker-subscription-high-v2` — cobrança, sandbox, HOME, flags
# proibidas, allowlist, modelo e effort. Só o profile_id muda.
id: codex-build-worker-subscription-sol-high-v2
agent: codex
billing_mode: subscription_only
environment_mode: real-world
instruction_environment: sanitized_user_home
commit_owner: orchestrator
official_validation_owner: orchestrator
worker_validation_policy: targeted
argv:
  - codex
  - exec
  - --json
  - --strict-config
  - --ignore-user-config
  - --sandbox
  - workspace-write
  - --ephemeral
  - --ignore-rules
  - --model
  - gpt-5.6-sol
  - --config
  - 'model_reasoning_effort="high"'
  - '-'
prompt_delivery: stdin
forbidden_flags:
  - resume
  - fork
  - --last
  - --session-id
  - --with-api-key
  - --with-access-token
env_allowlist:
  - PATH
  - LANG
  - LC_ALL
  - TERM
  - USER
  - SHELL
  - CODEX_HOME
env_extra:
  CI: '1'
control_markers:
  strict_config: --strict-config
  user_config_ignored: --ignore-user-config
  event_stream: --json
  model_pinned: --model
  reasoning_pinned: --config
  session_persistence: --ephemeral
  execpolicy_rules_ignored: --ignore-rules
notes:
  - 'Modelo: gpt-5.6-sol; reasoning effort: high, ambos fixados no argv.'
  - 'Identidade explícita Sol High. Equivalente operacional ao legacy codex-build-worker-subscription-high-v2; use este id em runs novos.'
  - 'Cobrança: assinatura ChatGPT Plus (Sign in with ChatGPT). Nenhuma chave de API na allowlist.'
  - 'O worker edita o patch e pode validar de forma direcionada; commit e validação oficial pertencem ao orquestrador.'
  - 'HOME é sanitizado; ~/.agents e skills pessoais ficam fora. --ignore-rules trata somente execpolicy .rules.'
  - 'CODEX_HOME preserva autenticação sem copiar configuração ou secrets para o HOME sanitizado.'
