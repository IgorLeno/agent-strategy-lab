      sub_scores|null, coverage|null — espelhando ScoreRecord; NÃO inventar
      scalar score/aggregate_score/total_score/weighted_score; budgets_used
      permanece somente no ScoreRecord autoritativo e NÃO é duplicado aqui;
      campos de score ausentes/não selecionados = null com provenance);
      FACTS (had_inference true|false|null com provenance, attempt_role,
      interventions|null); COST (duration_ms, tokens breakdown incluindo
