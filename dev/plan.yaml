      - environment requirements representados de forma comparável aos fatos de inspection.
      - Custo/budget esperado de validação representado.
      - Duração esperada e máxima são específicas da task.
      - Estimated task duration, worker runtime budget e validation command timeout permanecem conceitos separados no contrato.
      - Cada conceito de tempo responde a um bound próprio; o contrato não cruza limites entre eles.
      - Nenhum teto universal de duração existe no contrato, provado por teste.
