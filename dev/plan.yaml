  - id: M52A
    title: Provider observations preservadas no runtime comum
    blocked_by: [M52]
    objective: >-
      Fechar o gap semântico encontrado pela revisão humana de M52: o runtime
      comum executeWithAdapter chama adapter.parseLine(raw), que devolve
      ParsedProviderLine { event, observation? }, mas preserva apenas .event e
      descarta .observation. Preservar a ProviderObservation (usage, cost,
      terminal) produzida pelo adapter através do RESULTADO do runtime comum,
      sem misturá-la com os fatos objetivos do processo — timeout, exit code,
      sinal, duração, cleanup/survivors, ExecutionStatus. A solução mínima
      pode estender AdapterExecutionRun com observations ou usar representação
      equivalente e auditável (inclusive preservar ParsedProviderLine ou
      correlação equivalente, se for mais auditável), desde que a associação
      entre observation e a linha/evento de origem NÃO fique ambígua quando
      houver múltiplas observations. O ExecutionRecord continua sendo montado
      pelo runtime com fatos objetivos e métricas normalizadas: usage.tokens
      válido PODE alimentar metrics.tokens com provenance explícita (ausência
      vira null + provenance, nunca zero; zero observado é zero real); cost
      explicitamente USD/API-equivalent e compatível com o schema atual PODE
      alimentar api_equivalent_usd com provenance, sem conversão de moeda
      (cost incompatível permanece observation); terminal PERMANECE
      observation, não precisa ser campo do ExecutionRecord e nunca altera
      ExecutionStatus — terminal=failure do provider pode coexistir com
      ExecutionStatus.COMPLETED, porque o processo completou e o resultado
      lógico do provider foi failure. NÃO expandir
      src/schemas/execution-record.ts apenas para armazenar terminal ou um
      blob de provider; se a implementação revelar necessidade arquitetural
      real de alterar o schema estável, isso exige decisão humana explícita e
      não pode ser consequência implícita desta tarefa. Tarefa LOW-LEVEL:
      recebe argv/cwd/env/manifest/gracePeriodMs/cleanupConfirmTimeoutMs
      explicitamente e NÃO chama buildInvocation. A integração
      resolveAdapter(profile.cli) -> adapter.buildInvocation(...) ->
      argv/env/stdin -> executeWithAdapter(...) permanece diferida para M62.
      Nenhum provider real, nenhum quota-usage.json.
    initial_files:
      - src/runner/execute.ts
      - src/adapters/contract.ts
    acceptance:
      - ParsedProviderLine.observation não é descartada pelo runtime comum.
      - usage, cost e terminal permanecem acessíveis no resultado da execução através de representação auditável, sem ambiguidade sobre de qual parse cada observation veio.
      - usage.tokens válido pode alimentar ExecutionRecord.metrics.tokens com provenance explícita; ausência vira null + provenance, nunca zero.
      - cost explicitamente USD/API-equivalent pode alimentar api_equivalent_usd; outras moedas não são convertidas e permanecem observation.
      - terminal do provider permanece observation e não altera ExecutionStatus.
      - ExecutionStatus continua exclusivamente derivado de fatos objetivos do processo.
      - O fake mantém record/events observavelmente backward-compatible.
      - Um adapter customizado prova que as observations vêm do adapter e não são inventadas pelo runtime.
      - buildInvocation continua fora deste runtime low-level; a integração segue diferida para M62.
      - Nenhum provider real executado e nenhum quota-usage.json lido ou escrito.
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/adapters/provider-observations.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900

