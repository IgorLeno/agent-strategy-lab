      TaskPerformanceRecord (agregado por trial/task): ATTEMPTS com
      contagens ORTOGONAIS — operational_attempts; attempts_with_inference +
      attempts_without_inference + attempts_inference_unknown particionando
      exatamente operational_attempts; infra_error_attempts (contagem por
      execution_status, que PODE intersectar attempts_with_inference);
      repair_attempts; escalations; attempts_role_unknown. NENHUMA
