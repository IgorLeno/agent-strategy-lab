  - id: M44
    title: Schema QuotaUsage provider-neutro do produto
    blocked_by: [M43]
    objective: >-
      Criar src/schemas/quota-usage.ts (produto; NUNCA importar de dev/lib):
      QuotaWindow genérica com window_id string não vazia DEFINIDA PELO
      PROVIDER (ex.: five_hour, seven_day — nunca campos fixos do stable
      kernel), before_used_pct e after_used_pct (number|null), consumed_pp
      (number|null), same_window (boolean|null) e reason_code (OK |
      RATE_LIMIT_WINDOW_RESET | MEASUREMENT_UNAVAILABLE |
      WINDOW_LABEL_UNPARSEABLE | OBSERVED_DELTA_NEGATIVE), mais provenance
      por janela. QuotaUsage agrega provider (string não vazia), observation
      { status: OBSERVED | UNAVAILABLE, reason_code, provenance } e windows
      (lista de QuotaWindow). OBSERVED = probe executado e resultado
      interpretável — windows pode legitimamente ser []; UNAVAILABLE = sem
      fonte observável, probe falhou ou provider sem mecanismo verificável —
      windows DEVE ser [] (PROIBIDO inventar QuotaWindow só para representar
      indisponibilidade). windows=[] sozinho NÃO basta: o status de
      observation distingue zero windows observadas de medição indisponível.
      Documentar no schema: consumed_pp é pontos percentuais observados —
      não é token, não é dinheiro, NUNCA é somado entre janelas incompatíveis
      e só é comparável entre mesmo window_id e mesmo provider. Medição
      indisponível de uma janela = null + reason_code na QuotaWindow, nunca
      zero; indisponibilidade do conjunto = observation.status UNAVAILABLE.
    initial_files:
      - src/schemas/execution-record.ts
      - src/schemas/index.ts
    acceptance:
      - Parse válido/inválido cobre cada reason_code de janela, window_id arbitrário não vazio, observation OBSERVED com windows [] e observation UNAVAILABLE com windows []; window_id vazio é rejeitado; UNAVAILABLE com windows não vazia é rejeitado.
      - consumed_pp numérico com same_window false é rejeitado (delta entre janelas incompatíveis não existe).
      - Docstrings do schema declaram a não-somabilidade entre janelas, a comparabilidade restrita a mesmo window_id+provider e a distinção OBSERVED([]) vs UNAVAILABLE([]).
    validation:
      - argv: [pnpm, typecheck]
        timeout_seconds: 300
      - argv: [pnpm, exec, vitest, run, test/schemas/quota-usage.test.ts]
        timeout_seconds: 300
      - argv: [pnpm, test]
        timeout_seconds: 900

  - id: M45
    title: InterventionRecord e fatos ortogonais de attempt
    blocked_by: [M44]
    objective: >-
      Criar src/schemas/intervention.ts (InterventionRecord: intervention_id,
      type: operational_cleanup | manual_fix | design_decision | other,
      description não vazia, occurred_at ISO, affects_autonomy boolean) e a
      área nova src/performance/ com a função pura deriveAttemptFacts que
      produz, por attempt, dimensões ORTOGONAIS e não mutuamente exclusivas:
      execution_status (o status do ExecutionRecord, inalterado);
      had_inference true | false | null com provenance — true SOMENTE com
      evidência positiva de inferência observada (eventos/model usage
      objetivos, ou outra evidência objetiva comprovada do runtime/
      orchestrator); false SOMENTE com evidência positiva/autoritativa de
      ZERO inferência (ex.: usage/cost/tokens zero verificáveis e nenhum
      modelo executado); null quando a evidência não permite afirmar true
      nem false (sem eventos, transporte falhou cedo, métricas indisponíveis,
      zero não comprovado). PROIBIDO: absence_of_event => false.
      evaluation_outcome (PASS | FAIL | none quando não avaliado);
      attempt_role (initial | repair | escalation | unknown — vem da
      história fornecida, nunca é inferido do conteúdo); interventions
      (lista possivelmente vazia OU null/unknown quando não há registro).
      NÃO existe classificação binária INFRA vs INFERENCE_BEARING: um
      attempt com execution_status INFRA_ERROR e had_inference true|false|null
      é representável conforme a prova disponível. A derivação usa somente
      evidência derivada pelo orquestrador — self-report do provider nunca
      prova fato objetivo. Nenhum I/O em src/performance/ nesta tarefa.
    initial_files:
      - src/schemas/quota-usage.ts
      - src/core/enums.ts
    acceptance:
      - INFRA_ERROR + nenhum evento + nenhuma prova autoritativa de zero inference produz had_inference null (nunca false).
