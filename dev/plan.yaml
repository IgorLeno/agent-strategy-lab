      baseline histórico do M1 (commit 4b33817f141359ed8b802f4b119775ece43c9289;
      evidência histórica nunca é reescrita); missão (plataforma de engenharia
      de software orientada por evidência para selecionar, coordenar e melhorar
      agentes de desenvolvimento); STABLE KERNEL (Task/Trial/Run, Evidence/
      Metrics, Evaluation, Score, Qualification, Profiles, Envelopes) com os 4
      critérios de inclusão (provider-independent; necessário para evidence/
      reprodutibilidade; útil a múltiplas estratégias/projetos; remoção
      quebraria a semântica Task/Trial/Run/Evidence); experiment plane vs
      control plane; execution contract com agentes substituíveis (Claude,
      Codex, Hermes e futuros nunca são autoridade de processo); extensions com
      incubação DISCOVERED->CANDIDATE->SANDBOXED->BENCHMARKED->PROMOTED; modo
      EXPERIMENTAL vs OPERATIONAL (dado operacional nunca vira benchmark
      controlado silenciosamente); autoridades (humano = produto/design; lab =
      processo/evidência); dev/ = bootstrap harness, não arquitetura do
      produto; non-goals (dashboard, multi-user, auth, scheduler distribuído,
      marketplace, memory system, workflow DSL, supervisor complexo,
      auto-remoção de config de máquina, adaptive router, microservices).
      Nenhum arquivo de src/ é alterado nesta tarefa.
    initial_files:
