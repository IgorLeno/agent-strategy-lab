      execução real. NÃO reutilizar dev/lib/billing.ts como arquitetura
      pública. A guarda deve responder antes do launch se uma execução
      inference-bearing real pode ou não começar. Separar autorização, modo de
      cobrança, quota conhecida/desconhecida, custo/budget e provenance da
      decisão. Sem autorização suficiente, launch deve ser bloqueado antes do
      spawn. Não inventar consumo nem custo quando não há fonte autoritativa.
    acceptance:
