      válido e suficiente para reprodução. O corpus não é a suite definitiva
      de 8–12 tasks. A suite maior permanece deferida para Marco 3 / pós-piloto.
      O corpus deve favorecer execução determinística, validação objetiva,
      baixo custo, escopo pequeno e diferenças de dificuldade/forma suficientes
      para não medir uma única microclasse de problema. Não usar resultados
      futuros para escolher as tasks.
