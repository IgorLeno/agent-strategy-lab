# Perfil Codex Sol com reasoning High, pago somente pela assinatura ChatGPT.
#
# A CLI instalada não expõe uma flag própria de reasoning. O argv usa o
# override genérico documentado por `codex exec --help`, e `--strict-config`
# faz um run futuro recusar a chave se ela deixar de ser reconhecida.
# `--ignore-user-config` impede que config.toml ou uma seleção anterior da UI
# participe da escolha do esforço. Autenticação continua sendo provada pelo
# comando local e gratuito `codex login status` antes de qualquer lançamento.
id: codex-build-worker-subscription-high-v1
agent: codex
billing_mode: subscription_only
environment_mode: real-world
instruction_environment: sanitized_user_home
argv:
  - codex
  - exec
  - --json
  - --strict-config
  - --ignore-user-config
  - --sandbox
  - workspace-write
  - --ephemeral
  - --ignore-rules
  - --model
  - gpt-5.6-sol
  - --config
  - 'model_reasoning_effort="high"'
  - '-'
prompt_delivery: stdin
forbidden_flags:
  - resume
  - fork
  - --last
  - --session-id
  - --with-api-key
  - --with-access-token
env_allowlist:
  - PATH
  - LANG
  - LC_ALL
  - TERM
  - USER
  - SHELL
  - CODEX_HOME
env_extra:
  CI: '1'
  GIT_AUTHOR_NAME: 'Agent Strategy Lab Worker'
  GIT_AUTHOR_EMAIL: 'agent-strategy-lab@localhost'
  GIT_COMMITTER_NAME: 'Agent Strategy Lab Worker'
  GIT_COMMITTER_EMAIL: 'agent-strategy-lab@localhost'
control_markers:
  strict_config: --strict-config
  user_config_ignored: --ignore-user-config
  event_stream: --json
  model_pinned: --model
  reasoning_pinned: --config
  session_persistence: --ephemeral
  execpolicy_rules_ignored: --ignore-rules
notes:
  - 'Modelo: gpt-5.6-sol; reasoning effort: high, ambos fixados no argv.'
  - 'Cobrança: assinatura ChatGPT Plus (Sign in with ChatGPT). Nenhuma chave de API na allowlist.'
  - 'Execução consome a franquia da assinatura: só rodar com autorização explícita do usuário.'
  - 'Verificado contra codex exec --help: --config, --ignore-user-config, --sandbox, --ephemeral, --ignore-rules, --json, --strict-config e --model.'
  - 'HOME é sanitizado; ~/.agents e skills pessoais ficam fora. --ignore-rules trata somente execpolicy .rules.'
  - 'CODEX_HOME preserva autenticação sem copiar configuração ou secrets para o HOME sanitizado.'
  - 'O stream JSONL não traz estimativa de custo: provider_estimated_api_equivalent_usd fica null.'
